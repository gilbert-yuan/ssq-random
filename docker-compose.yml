version: "2.1"

services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    container_name: ssq-random-app
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: postgresql://ssq:${POSTGRES_PASSWORD:-ssq_random_password}@postgres:5432/ssq_random
      DB_SSL: "0"
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/api/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>process.exit(r.statusCode===200?0:1)); }).on('error', ()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ssq-random-postgres
    restart: always
    environment:
      POSTGRES_DB: ssq_random
      POSTGRES_USER: ssq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssq_random_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssq -d ssq_random"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
