# Nginx site config for ssq.gilbert.ink
# Ubuntu 16.04 friendly version.
#
# Important:
#   If curl shows "gnutls_handshake() failed: An unexpected TLS packet was received",
#   port 443 is usually serving plain HTTP from another server block.
#   This config marks this HTTPS server as default_server to catch 443 traffic.
#
# Install:
#   sudo cp deploy/nginx/ssq.gilbert.ink.conf /etc/nginx/sites-available/ssq.gilbert.ink.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/ssq.gilbert.ink.conf /etc/nginx/sites-enabled/ssq.gilbert.ink.conf
#   sudo nginx -t
#   sudo service nginx reload

upstream ssq_random_node {
    server 127.0.0.1:5173;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ssq.gilbert.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ssq.gilbert.ink$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ssq.gilbert.ink;

    ssl_certificate /etc/letsencrypt/live/ssq.gilbert.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssq.gilbert.ink/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location = /m {
        return 302 /mobile.html;
    }

    location = /mobile {
        return 302 /mobile.html;
    }

    location = /mobile/ {
        return 302 /mobile.html;
    }

    location / {
        proxy_pass http://ssq_random_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
