# Nginx site config for ssq.gilbert.ink
# Compatible with the stock Ubuntu 16.04 nginx style.
# Install example:
#   sudo cp deploy/nginx/ssq.gilbert.ink.conf /etc/nginx/sites-available/ssq.gilbert.ink.conf
#   sudo ln -s /etc/nginx/sites-available/ssq.gilbert.ink.conf /etc/nginx/sites-enabled/ssq.gilbert.ink.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream ssq_random_node {
    server 127.0.0.1:5173;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ssq.gilbert.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ssq.gilbert.ink;

    ssl_certificate /etc/letsencrypt/live/ssq.gilbert.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssq.gilbert.ink/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2;

    client_max_body_size 2m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Web desktop entry.
    location = / {
        proxy_pass http://ssq_random_node/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Mobile shortcut entries.
    location = /m {
        return 302 /mobile.html;
    }

    location = /mobile {
        return 302 /mobile.html;
    }

    location = /mobile/ {
        return 302 /mobile.html;
    }

    location = /mobile.html {
        proxy_pass http://ssq_random_node/mobile.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # APIs stay shared by desktop and mobile pages.
    location /api/ {
        proxy_pass http://ssq_random_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Static assets are served by the Node app; cache immutable-looking assets lightly at the edge.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        proxy_pass http://ssq_random_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything else falls back to the web app.
    location / {
        proxy_pass http://ssq_random_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
